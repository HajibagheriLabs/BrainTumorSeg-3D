# baseline 3d u-net on msd task01; paths are relative to the repository root
name: unet3d_baseline
seed: 42

data:
  root: data/raw/Task01_BrainTumour
  processed_dir: data/processed
  splits_file: configs/splits.json
  # the only configuration the test split is scored with, named before that evaluation
  frozen_config: unet3d_baseline
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    seed: 42
  # msd repeats patients across case ids; thumbnails this similar are linked as one patient
  link:
    thumbnail_factor: 4
    threshold: 0.55
    # identical voxel data scores 1.0 up to rounding; the next most similar pair is below 0.98
    duplicate_threshold: 0.999
  # brats composite regions over msd labels (1 oedema, 2 non-enhancing tumour, 3 enhancing tumour)
  regions:
    WT: [1, 2, 3]
    TC: [2, 3]
    ET: [3]

model:
  architecture: unet
  in_channels: 4
  out_channels: 4
  channels: [32, 64, 128, 256, 320]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.0

train:
  patch_size: [128, 128, 128]
  batch_size: 2
  epochs: 300
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  loss: dice_ce
  scheduler: cosine
  amp: true
  # half the patches are centred on tumour so small lesions are seen often enough
  foreground_crop_prob: 0.5
  val_every: 5

augment:
  enabled: true
  flip_prob: 0.5
  intensity_prob: 0.5
  intensity_scale: 0.1
  intensity_shift: 0.1

inference:
  sw_batch_size: 4
  overlap: 0.5
  blend_mode: gaussian
  checkpoint_run: null

runtime:
  device: cuda
  num_threads: 2
  # the float16 cases fit in 24 GB beside the model, so every crop and augmentation runs there
  cache_on_device: true
  output_dir: runs
  tracking_dir: mlruns
  experiment: braintumorseg-3d
